name: Validate encrypted production secrets

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sops-secrets.yml
      - .gitignore
      - .sops.yaml
      - scripts/check-sops-env.py
      - scripts/restore-dotenv-layout.py
      - secrets/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/sops-secrets.yml
      - .gitignore
      - .sops.yaml
      - scripts/check-sops-env.py
      - scripts/restore-dotenv-layout.py
      - secrets/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ciphertext without production keys
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Reject tracked plaintext environment files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' tracked_env_files < <(git ls-files -z -- '*.env')
          [[ ${#tracked_env_files[@]} -eq 1 ]]
          [[ ${tracked_env_files[0]} == secrets/production.sops.env ]]

      - name: Validate the narrow SOPS rule and ciphertext structure
        shell: bash
        env:
          EXPECTED_AGE_RECIPIENT: age1vvzm5pczjum52v5alall8euucjen9q4v9xa5g0xmswhna5vare9qwv9rq6
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          expected = (
              "creation_rules:\n"
              "  - path_regex: ^secrets/production\\.sops\\.env$\n"
              f"    age: {os.environ['EXPECTED_AGE_RECIPIENT']}\n"
          )
          if Path(".sops.yaml").read_text(encoding="utf-8") != expected:
              raise SystemExit(".sops.yaml differs from the single approved production rule")
          PY
          python3 scripts/check-sops-env.py \
            secrets/production.sops.env \
            secrets/production.env.keys \
            secrets/production.env.layout.json \
            "$EXPECTED_AGE_RECIPIENT"
