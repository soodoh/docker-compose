name: Validate encrypted production secrets

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sops-secrets.yml
      - .gitignore
      - .sops.yaml
      - scripts/check-sops-env.py
      - scripts/restore-dotenv-layout.py
      - secrets/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/sops-secrets.yml
      - .gitignore
      - .sops.yaml
      - scripts/check-sops-env.py
      - scripts/restore-dotenv-layout.py
      - secrets/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ciphertext without production keys
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reject tracked plaintext environment files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' tracked_env_files < <(git ls-files -z -- '*.env')
          [[ ${#tracked_env_files[@]} -eq 1 ]]
          [[ ${tracked_env_files[0]} == secrets/production.sops.env ]]

      - name: Validate the narrow SOPS rule and ciphertext structure
        shell: bash
        env:
          EXPECTED_RECOVERY_RECIPIENT: age1vvzm5pczjum52v5alall8euucjen9q4v9xa5g0xmswhna5vare9qwv9rq6
          EXPECTED_CI_RECIPIENT: ${{ vars.CI_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          recipients = [os.environ["EXPECTED_RECOVERY_RECIPIENT"]]
          if os.environ.get("EXPECTED_CI_RECIPIENT"):
              recipients.append(os.environ["EXPECTED_CI_RECIPIENT"])
          expected = (
              "creation_rules:\n"
              "  - path_regex: ^secrets/production\\.sops\\.env$\n"
              f"    age: {','.join(recipients)}\n"
          )
          if Path(".sops.yaml").read_text(encoding="utf-8") != expected:
              raise SystemExit(".sops.yaml differs from the approved production recipients")
          Path("/tmp/expected-sops-recipients").write_text("\n".join(recipients))
          PY
          mapfile -t recipients </tmp/expected-sops-recipients
          python3 scripts/check-sops-env.py \
            secrets/production.sops.env \
            secrets/production.env.keys \
            secrets/production.env.layout.json \
            "${recipients[@]}"
