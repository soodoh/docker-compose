---
name: Build signed Coral DKMS package

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/coral-package.yml
      - recovery/coral/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/coral-package.yml
      - recovery/coral/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build:
    name: Reproduce and sign package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build in a digest-pinned Arch environment
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/coral-package"
          mkdir -p "$output"
          docker run --rm --platform linux/amd64 \
            -v "$PWD/recovery/coral:/source:ro" \
            -v "$output:/output" \
            archlinux:base-devel@sha256:c1829f370be8434135f43fb3acaef1256780804ac3b2d2eec90dfb1232e1ffdf \
            bash -c '
              set -euo pipefail
              useradd --create-home builder
              for attempt in one two; do
                rm -rf /tmp/build
                mkdir /tmp/build
                cp -a /source/. /tmp/build/
                chown -R builder:builder /tmp/build
                (
                  cd /tmp/build
                  runuser -u builder -- env SOURCE_DATE_EPOCH=1704067200 \
                    makepkg --noconfirm --nodeps
                )
                install -m 0644 \
                  /tmp/build/gasket-dkms-git-r236.5815ee3-3-x86_64.pkg.tar.zst \
                  "/output/package-$attempt.pkg.tar.zst"
              done
              cmp /output/package-one.pkg.tar.zst /output/package-two.pkg.tar.zst
              mv /output/package-one.pkg.tar.zst \
                /output/gasket-dkms-git-r236.5815ee3-3-x86_64.pkg.tar.zst
              rm /output/package-two.pkg.tar.zst
            '
          sha256sum "$output/gasket-dkms-git-r236.5815ee3-3-x86_64.pkg.tar.zst" \
            | tee "$output/SHA256SUMS"


      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Publish and keylessly sign the immutable OCI artifact
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/home-lab/gasket-dkms-git"
          tag=r236.5815ee3-3
          package="$RUNNER_TEMP/coral-package/gasket-dkms-git-r236.5815ee3-3-x86_64.pkg.tar.zst"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          context="$RUNNER_TEMP/coral-image"
          mkdir -p "$context"
          install -m 0644 "$package" "$context/"
          cat >"$context/Dockerfile" <<'EOF'
          FROM scratch
          COPY gasket-dkms-git-r236.5815ee3-3-x86_64.pkg.tar.zst /artifact/
          CMD ["/artifact/gasket-dkms-git-r236.5815ee3-3-x86_64.pkg.tar.zst"]
          EOF
          docker buildx build --platform linux/amd64 --push \
            --tag "$repository:$tag" "$context"
          digest=$(docker buildx imagetools inspect "$repository:$tag" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "$repository@$digest"
          echo "Published immutable package digest: $digest" | tee -a "$GITHUB_STEP_SUMMARY"
