---
name: Publish immutable Wolf child images

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: wolf-image-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish reviewed Wolf images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: infrastructure-apply
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Prepare the restricted apply controller
        uses: ./.github/actions/ansible-controller
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-apply
          target-ip: docker-host
          host-key-fingerprint: ${{ vars.ARCH_SSH_HOST_KEY_FINGERPRINT }}
          accept-subnet-routes: "false"

      - name: Capture, publish, and verify exact child images
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 .local/wolf
          records=.local/wolf/records.ndjson
          : >"$records"
          while IFS=$'\t' read -r name image_id; do
            [[ $image_id =~ ^sha256:[0-9a-f]{64}$ ]]
            repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/home-lab/wolf-$name"
            tag="image-${image_id#sha256:}"
            jq -cn \
              --arg name "$name" \
              --arg source_image_id "$image_id" \
              --arg repository "$repository" \
              --arg tag "$tag" \
              '{name:$name,source_image_id:$source_image_id,repository:$repository,tag:$tag}' \
              >>"$records"
          done < <(ssh -n ansible-deploy@docker-host '
            set -eu
            for spec in \
              "wolf-ui|ghcr.io/games-on-whales/wolf-ui:main" \
              "steam|ghcr.io/games-on-whales/steam:edge" \
              "es-de|ghcr.io/games-on-whales/es-de:edge"; do
              name=${spec%%|*}
              source=${spec#*|}
              image_id=$(sudo -n /usr/bin/docker image inspect --format "{{.Id}}" "$source")
              printf "%s\t%s\n" "$name" "$image_id"
            done
          ')
          jq -s '{schema:1,images:sort_by(.name)}' "$records" >.local/wolf/manifest.json
          jq -e '.images | length == 3' .local/wolf/manifest.json >/dev/null

          ssh -n ansible-deploy@docker-host '
            rm -rf -- /tmp/home-lab-wolf-publication
            install -d -m 0700 /tmp/home-lab-wolf-publication
          '
          cleanup() {
            ssh -n ansible-deploy@docker-host \
              'rm -rf -- /tmp/home-lab-wolf-publication' >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM
          scp scripts/publish-wolf-images .local/wolf/manifest.json \
            ansible-deploy@docker-host:/tmp/home-lab-wolf-publication/
          printf '%s\n%s\n' "$GHCR_TOKEN" "$GITHUB_ACTOR" \
            | ssh ansible-deploy@docker-host '
                IFS= read -r GHCR_TOKEN
                IFS= read -r GHCR_USERNAME
                export GHCR_TOKEN GHCR_USERNAME
                WOLF_DOCKER_USE_SUDO=true \
                WOLF_IMAGE_PUBLICATION_CONFIRMED=publish-reviewed-wolf-images-to-ghcr \
                /tmp/home-lab-wolf-publication/publish-wolf-images \
                  --manifest /tmp/home-lab-wolf-publication/manifest.json \
                  --output /tmp/home-lab-wolf-publication/wolf-images.json
              '
          scp ansible-deploy@docker-host:/tmp/home-lab-wolf-publication/wolf-images.json \
            .local/wolf/wolf-images.json
          chmod 0600 .local/wolf/wolf-images.json
          jq -e '
            .schema == 1 and (.images | length == 3) and
            all(.images[];
              (.source_image_id | test("^sha256:[0-9a-f]{64}$")) and
              (.digest | test("^ghcr\\.io/.+@sha256:[0-9a-f]{64}$")))
          ' .local/wolf/wolf-images.json >/dev/null
          echo "wolf_lock_sha256=$(sha256sum .local/wolf/wolf-images.json | awk '{print $1}')"

      - name: Upload immutable Wolf image lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wolf-images-${{ github.run_id }}
          path: .local/wolf/wolf-images.json
          if-no-files-found: error
          retention-days: 1
