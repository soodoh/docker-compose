name: Bootstrap automatic plan identity

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Request the protected bootstrap apply after the check job
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: ansible-production
  cancel-in-progress: false

env:
  ANSIBLE_HOST_KEY_CHECKING: "true"
  ANSIBLE_NOCOLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  check:
    name: Check the plan-user bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: infrastructure-apply
    outputs:
      plan_hash: ${{ steps.check.outputs.plan_hash }}

    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare the restricted bootstrap controller
        uses: ./.github/actions/ansible-controller
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-apply
          target-ip: 100.111.210.72
          host-key-fingerprint: SHA256:2wHl3xsBkNYprqP99usjZdwj2Rytcc+MtJVErhowVYw

      - name: Validate and check the bootstrap
        id: check
        working-directory: ansible
        run: |
          set -euo pipefail
          ansible-playbook -i inventory/production.yml \
            --syntax-check playbooks/plan-controller.yml

          check_log="$RUNNER_TEMP/plan-controller-check.log"
          ansible-playbook -i inventory/production.yml \
            playbooks/plan-controller.yml --check --diff \
            --tags management_plane | tee "$check_log"

          recap=$(python ../.github/scripts/parse-ansible-recap.py \
            "$check_log" docker-host-production)
          [[ $(jq -r '.unreachable' <<<"$recap") == 0 ]]
          [[ $(jq -r '.failed' <<<"$recap") == 0 ]]
          plan_hash=$(sha256sum "$check_log" | awk '{print $1}')
          echo "plan_hash=$plan_hash" >>"$GITHUB_OUTPUT"

          {
            echo "### Plan-user bootstrap check"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Apply requested: \`${{ inputs.apply }}\`"
            echo "- Plan SHA-256: \`$plan_hash\`"
            echo "- Recap: \`$recap\`"
            echo
            echo "The separately protected apply job revalidates this complete plan hash before mutation."
          } >>"$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply the approved plan-user bootstrap
    needs: check
    if: inputs.apply == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: infrastructure-apply

    steps:
      - name: Check out the exact checked commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Require the checked commit to remain the main tip
        run: |
          set -euo pipefail
          [[ $(git rev-parse HEAD) == "$GITHUB_SHA" ]]
          git fetch --quiet --no-tags origin refs/heads/main
          [[ $(git rev-parse FETCH_HEAD) == "$GITHUB_SHA" ]]

      - name: Prepare the restricted apply controller
        uses: ./.github/actions/ansible-controller
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-apply
          target-ip: 100.111.210.72
          host-key-fingerprint: SHA256:2wHl3xsBkNYprqP99usjZdwj2Rytcc+MtJVErhowVYw

      - name: Revalidate the checked bootstrap plan
        working-directory: ansible
        env:
          EXPECTED_PLAN_HASH: ${{ needs.check.outputs.plan_hash }}
        run: |
          set -euo pipefail
          recheck_log="$RUNNER_TEMP/plan-controller-recheck.log"
          ansible-playbook -i inventory/production.yml \
            playbooks/plan-controller.yml --check --diff \
            --tags management_plane | tee "$recheck_log"

          recap=$(python ../.github/scripts/parse-ansible-recap.py \
            "$recheck_log" docker-host-production)
          [[ $(jq -r '.unreachable' <<<"$recap") == 0 ]]
          [[ $(jq -r '.failed' <<<"$recap") == 0 ]]

          actual_plan_hash=$(sha256sum "$recheck_log" | awk '{print $1}')
          [[ $actual_plan_hash == "$EXPECTED_PLAN_HASH" ]]

      - name: Apply through the management-plane guard
        id: apply
        working-directory: ansible
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin refs/heads/main
          [[ $(git rev-parse FETCH_HEAD) == "$GITHUB_SHA" ]]

          apply_log="$RUNNER_TEMP/plan-controller-apply.log"
          ansible-playbook -i inventory/production.yml \
            playbooks/plan-controller.yml --tags management_plane \
            -e iac_apply_confirmed=true \
            -e iac_apply_tag=management_plane | tee "$apply_log"

          recap=$(python ../.github/scripts/parse-ansible-recap.py \
            "$apply_log" docker-host-production)
          [[ $(jq -r '.unreachable' <<<"$recap") == 0 ]]
          [[ $(jq -r '.failed' <<<"$recap") == 0 ]]
          echo "recap=$recap" >>"$GITHUB_OUTPUT"

      - name: Require zero bootstrap changes after the apply attempt
        id: postcheck
        if: >-
          always() &&
          (steps.apply.outcome == 'success' || steps.apply.outcome == 'failure')
        working-directory: ansible
        run: |
          set -euo pipefail
          check_log="$RUNNER_TEMP/plan-controller-postcheck.log"
          ansible-playbook -i inventory/production.yml \
            playbooks/plan-controller.yml --check --diff \
            --tags management_plane | tee "$check_log"

          recap=$(python ../.github/scripts/parse-ansible-recap.py \
            "$check_log" docker-host-production)
          [[ $(jq -r '.changed' <<<"$recap") == 0 ]]
          [[ $(jq -r '.unreachable' <<<"$recap") == 0 ]]
          [[ $(jq -r '.failed' <<<"$recap") == 0 ]]
          echo "recap=$recap" >>"$GITHUB_OUTPUT"

      - name: Audit the plan-user privilege boundary after the apply attempt
        id: boundary
        if: >-
          always() &&
          (steps.apply.outcome == 'success' || steps.apply.outcome == 'failure')
        working-directory: ansible
        run: |
          set -euo pipefail
          audit_log="$RUNNER_TEMP/plan-controller-audit.log"
          ansible-playbook -i inventory/production.yml \
            playbooks/plan-controller-audit.yml --check | tee "$audit_log"

          recap=$(python ../.github/scripts/parse-ansible-recap.py \
            "$audit_log" docker-host-production)
          [[ $(jq -r '.changed' <<<"$recap") == 0 ]]
          [[ $(jq -r '.unreachable' <<<"$recap") == 0 ]]
          [[ $(jq -r '.failed' <<<"$recap") == 0 ]]
          echo "recap=$recap" >>"$GITHUB_OUTPUT"

      - name: Verify unprivileged plan-user connectivity after the apply attempt
        if: >-
          always() &&
          (steps.apply.outcome == 'success' || steps.apply.outcome == 'failure')
        working-directory: ansible
        run: |
          set -euo pipefail
          ansible -i inventory/production-plan.yml docker_host \
            -m ansible.builtin.ping

      - name: Summarize the bootstrap attempt
        if: >-
          always() &&
          (steps.apply.outcome == 'success' || steps.apply.outcome == 'failure')
        env:
          APPLY_RECAP: ${{ steps.apply.outputs.recap }}
          POSTCHECK_RECAP: ${{ steps.postcheck.outputs.recap }}
          BOUNDARY_RECAP: ${{ steps.boundary.outputs.recap }}
        run: |
          set -euo pipefail
          {
            echo "### Plan-user bootstrap verification"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Apply outcome: \`${{ steps.apply.outcome }}\`"
            echo "- Apply recap: \`${APPLY_RECAP:-unavailable}\`"
            echo "- Zero-change post-check: \`${POSTCHECK_RECAP:-unavailable}\`"
            echo "- Privilege-boundary audit: \`${BOUNDARY_RECAP:-unavailable}\`"
          } >>"$GITHUB_STEP_SUMMARY"
