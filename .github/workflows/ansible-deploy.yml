name: Ansible protected deployment

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - ansible/**
      - services/data/wolf/**
      - .github/actions/ansible-controller/**
      - .github/requirements-ansible-controller.lock
      - .github/scripts/**
      - .github/workflows/ansible-deploy.yml
  push:
    branches:
      - main
    paths:
      - ansible/**
      - services/data/wolf/**
      - .github/actions/ansible-controller/**
      - .github/requirements-ansible-controller.lock
      - .github/scripts/**
      - .github/workflows/ansible-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ansible-production
  cancel-in-progress: false

env:
  ANSIBLE_HOST_KEY_CHECKING: "true"
  ANSIBLE_NOCOLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  plan:
    name: Plan one approved Ansible tag
    if: >-
      vars.ANSIBLE_AUTO_PLAN_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
        (!github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: infrastructure-plan
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
      plan_hash: ${{ steps.plan.outputs.plan_hash }}
      tag: ${{ steps.intent.outputs.tag }}

    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate the reviewed deployment intent
        id: intent
        run: |
          set -euo pipefail
          tag=$(python .github/scripts/read-deploy-intent.py ansible/deploy-intent.yml)
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "Planning approved tag: $tag"

      - name: Prepare the restricted plan controller
        uses: ./.github/actions/ansible-controller
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-plan
          target-ip: docker-host
          host-key-fingerprint: SHA256:2wHl3xsBkNYprqP99usjZdwj2Rytcc+MtJVErhowVYw
          accept-subnet-routes: "false"

      - name: Validate inventory, connectivity, and playbook syntax
        working-directory: ansible
        run: |
          set -euo pipefail
          ansible-inventory -i inventory/production-plan.yml --graph
          ansible-playbook -i inventory/production-plan.yml --syntax-check playbooks/site.yml
          ansible -i inventory/production-plan.yml docker_host -m ansible.builtin.ping

      - name: Produce the remote check-mode plan
        id: plan
        working-directory: ansible
        env:
          DEPLOY_TAG: ${{ steps.intent.outputs.tag }}
        run: |
          set -euo pipefail
          plan_log="$RUNNER_TEMP/ansible-site-plan.log"
          ansible-playbook -i inventory/production-plan.yml \
            playbooks/site.yml --check --diff --tags "$DEPLOY_TAG" | tee "$plan_log"

          recap=$(python ../.github/scripts/parse-ansible-recap.py \
            "$plan_log" docker-host-production)
          changed=$(jq -r '.changed' <<<"$recap")
          unreachable=$(jq -r '.unreachable' <<<"$recap")
          failed=$(jq -r '.failed' <<<"$recap")

          [[ $unreachable == 0 ]]
          [[ $failed == 0 ]]

          plan_hash=$(sha256sum "$plan_log" | awk '{print $1}')
          if [[ $changed == 0 ]]; then
            has_changes=false
          else
            has_changes=true
          fi

          {
            echo "changed=$changed"
            echo "has_changes=$has_changes"
            echo "plan_hash=$plan_hash"
          } >>"$GITHUB_OUTPUT"

          {
            echo "### Ansible plan"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            echo "- Tag: \`$DEPLOY_TAG\`"
            echo "- Changed: \`$changed\`"
            echo "- Plan SHA-256: \`$plan_hash\`"
            echo "- Recap: \`$recap\`"
            echo
            echo "Pull request and manual-dispatch plans never apply. A changed push created by merging to main may continue through the guarded apply job."
          } >>"$GITHUB_STEP_SUMMARY"


  apply:
    name: Apply the PR-merge-approved Ansible plan
    needs: plan
    if: >-
      github.event_name == 'push' &&
      needs.plan.outputs.has_changes == 'true' &&
      vars.ANSIBLE_APPLY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: infrastructure-apply

    steps:
      - name: Check out the exact planned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify the planned commit and deployment intent
        env:
          PLANNED_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          [[ $(git rev-parse HEAD) == "$GITHUB_SHA" ]]
          git fetch --quiet --no-tags origin refs/heads/main
          [[ $(git rev-parse FETCH_HEAD) == "$GITHUB_SHA" ]]
          intent_tag=$(python .github/scripts/read-deploy-intent.py ansible/deploy-intent.yml)
          [[ $intent_tag == "$PLANNED_TAG" ]]

      - name: Prepare the restricted apply controller
        uses: ./.github/actions/ansible-controller
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-apply
          target-ip: docker-host
          host-key-fingerprint: SHA256:2wHl3xsBkNYprqP99usjZdwj2Rytcc+MtJVErhowVYw
          accept-subnet-routes: "false"

      - name: Validate inventory, connectivity, and playbook syntax
        working-directory: ansible
        run: |
          set -euo pipefail
          ansible-inventory -i inventory/production.yml --graph
          ansible-playbook -i inventory/production.yml --syntax-check playbooks/site.yml
          ansible -i inventory/production-plan.yml docker_host -m ansible.builtin.ping
          ansible -i inventory/production.yml docker_host -m ansible.builtin.ping

      - name: Revalidate the approved plan
        working-directory: ansible
        env:
          DEPLOY_TAG: ${{ needs.plan.outputs.tag }}
          EXPECTED_PLAN_HASH: ${{ needs.plan.outputs.plan_hash }}
        run: |
          set -euo pipefail
          replan_log="$RUNNER_TEMP/ansible-site-replan.log"
          ansible-playbook -i inventory/production-plan.yml \
            playbooks/site.yml --check --diff --tags "$DEPLOY_TAG" | tee "$replan_log"

          replan_recap=$(python ../.github/scripts/parse-ansible-recap.py \
            "$replan_log" docker-host-production)
          [[ $(jq -r '.unreachable' <<<"$replan_recap") == 0 ]]
          [[ $(jq -r '.failed' <<<"$replan_recap") == 0 ]]

          actual_plan_hash=$(sha256sum "$replan_log" | awk '{print $1}')
          if [[ $actual_plan_hash != "$EXPECTED_PLAN_HASH" ]]; then
            echo "The approved plan changed before apply; refusing deployment." >&2
            echo "Expected: $EXPECTED_PLAN_HASH" >&2
            echo "Actual:   $actual_plan_hash" >&2
            exit 1
          fi

      - name: Apply the approved tag through the repository guard
        id: apply
        working-directory: ansible
        env:
          DEPLOY_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin refs/heads/main
          [[ $(git rev-parse FETCH_HEAD) == "$GITHUB_SHA" ]]
          apply_log="$RUNNER_TEMP/ansible-site-apply.log"
          ansible-playbook -i inventory/production.yml playbooks/site.yml \
            --tags "$DEPLOY_TAG" \
            -e iac_apply_confirmed=true \
            -e "iac_apply_tag=$DEPLOY_TAG" | tee "$apply_log"

          apply_recap=$(python ../.github/scripts/parse-ansible-recap.py \
            "$apply_log" docker-host-production)
          [[ $(jq -r '.unreachable' <<<"$apply_recap") == 0 ]]
          [[ $(jq -r '.failed' <<<"$apply_recap") == 0 ]]
          echo "recap=$apply_recap" >>"$GITHUB_OUTPUT"

      - name: Require zero changes after the apply attempt
        if: >-
          always() &&
          (steps.apply.outcome == 'success' || steps.apply.outcome == 'failure')
        working-directory: ansible
        env:
          DEPLOY_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          postcheck_log="$RUNNER_TEMP/ansible-site-postcheck.log"
          ansible-playbook -i inventory/production-plan.yml \
            playbooks/site.yml --check --diff --tags "$DEPLOY_TAG" | tee "$postcheck_log"

          postcheck_recap=$(python ../.github/scripts/parse-ansible-recap.py \
            "$postcheck_log" docker-host-production)
          [[ $(jq -r '.changed' <<<"$postcheck_recap") == 0 ]]
          [[ $(jq -r '.unreachable' <<<"$postcheck_recap") == 0 ]]
          [[ $(jq -r '.failed' <<<"$postcheck_recap") == 0 ]]
          echo "recap=$postcheck_recap" >>"$GITHUB_OUTPUT"

      - name: Run the full audit after the apply attempt
        id: audit
        if: >-
          always() &&
          (steps.apply.outcome == 'success' || steps.apply.outcome == 'failure')
        working-directory: ansible
        run: |
          set -euo pipefail
          audit_log="$RUNNER_TEMP/ansible-audit.log"
          ansible-playbook -i inventory/production.yml \
            playbooks/audit.yml --check --diff | tee "$audit_log"

          audit_recap=$(python ../.github/scripts/parse-ansible-recap.py \
            "$audit_log" docker-host-production)
          [[ $(jq -r '.changed' <<<"$audit_recap") == 0 ]]
          [[ $(jq -r '.unreachable' <<<"$audit_recap") == 0 ]]
          [[ $(jq -r '.failed' <<<"$audit_recap") == 0 ]]
          echo "recap=$audit_recap" >>"$GITHUB_OUTPUT"

      - name: Summarize the apply attempt
        if: >-
          always() &&
          (steps.apply.outcome == 'success' || steps.apply.outcome == 'failure')
        env:
          DEPLOY_TAG: ${{ needs.plan.outputs.tag }}
          EXPECTED_PLAN_HASH: ${{ needs.plan.outputs.plan_hash }}
          APPLY_RECAP: ${{ steps.apply.outputs.recap }}
          AUDIT_RECAP: ${{ steps.audit.outputs.recap }}
        run: |
          set -euo pipefail
          {
            echo "### Ansible apply verification"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Tag: \`$DEPLOY_TAG\`"
            echo "- Approved plan SHA-256: \`$EXPECTED_PLAN_HASH\`"
            echo "- Apply outcome: \`${{ steps.apply.outcome }}\`"
            echo "- Apply recap: \`${APPLY_RECAP:-unavailable}\`"
            echo "- Full audit: \`${AUDIT_RECAP:-unavailable}\`"
            echo
            echo "See the mandatory post-apply check step for its zero-change result."
          } >>"$GITHUB_STEP_SUMMARY"
