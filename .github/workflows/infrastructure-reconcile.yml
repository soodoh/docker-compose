---
name: Validate and reconcile infrastructure

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/actions/ansible-controller/**
      - .github/requirements-ansible-controller.lock
      - .github/scripts/**
      - .github/workflows/infrastructure-reconcile.yml
      - .github/workflows/proxmox-lxc-qualification.yml
      - ansible/**
      - infrastructure/**
      - scripts/**
  push:
    branches:
      - main
    paths:
      - .github/actions/ansible-controller/**
      - .github/requirements-ansible-controller.lock
      - .github/scripts/**
      - .github/workflows/infrastructure-reconcile.yml
      - .github/workflows/proxmox-lxc-qualification.yml
      - ansible/**
      - infrastructure/**
      - scripts/**
  workflow_dispatch:
    inputs:
      phase:
        description: Reconciliation phase
        required: true
        default: steady
        type: choice
        options:
          - steady
          - adoption
      ct_retirement:
        description: Select the staged CT retirement operation
        required: true
        default: none
        type: choice
        options:
          - none
          - unprotect
          - delete
      tailscale_gateway:
        description: Select the guarded Tailscale gateway-policy lifecycle
        required: true
        default: none
        type: choice
        options:
          - none
          - detach
          - retire
      network_migration:
        description: Permit only the reviewed Proxmox hardware-mapping migration
        required: false
        default: false
        type: boolean
      omada_qualification:
        description: Run only the disposable Omada provider qualification operation
        required: false
        default: none
        type: choice
        options:
          - none
          - create
          - remove

permissions:
  contents: read
  id-token: write

concurrency:
  group: infrastructure-production
  cancel-in-progress: false

env:
  ANSIBLE_HOST_KEY_CHECKING: "true"
  ANSIBLE_NOCOLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  validate:
    name: Validate infrastructure
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install contract-validation dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.4
      - run: bun install --frozen-lockfile

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.14"

      - name: Install validation tools
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --only-binary=:all: --require-hashes \
            --requirement .github/requirements-ansible-controller.lock
          python -m pip install --no-cache-dir 'ansible-lint==26.3.0' 'yamllint==1.38.0'

      - name: Validate contract, policies, provider locks, and scripts
        run: |
          set -euo pipefail
          ./scripts/validate-contract
          ./scripts/validate-provider-locks
          ./infrastructure/policy/test-policy.sh
          python .github/scripts/test-ct-retirement.py
          python .github/scripts/test-proxmox-lxc-qualification.py
          python .github/scripts/test-proxmox-lxc-workflow.py
          python .github/scripts/test-qualify-proxmox-lxc.py
          python .github/scripts/test-ct-compose-precheck.py
          python .github/scripts/test-reconcile-manifest.py
          ./scripts/test-recovery-tools
          python -m py_compile scripts/*.py .github/scripts/*.py
          shellcheck scripts/reconcile-infrastructure scripts/bootstrap-aws-state scripts/bootstrap-tailscale-state \
            scripts/bootstrap-proxmox-host scripts/build-recovery-bundle \
            scripts/collect-proxmox-protected-inputs scripts/migrate-proxmox-zfs-stack \
            scripts/migrate-sops-recipients \
            scripts/prepare-omada-plan-input scripts/prepare-provider-ca-bundle scripts/publish-wolf-images \
            scripts/qualify-proxmox-lxc scripts/rehearse-recovery scripts/restore-critical-backup \
            scripts/test-recovery-tools .github/scripts/prepare-ansible-controller.sh
          bash -n scripts/reconcile-infrastructure scripts/bootstrap-aws-state scripts/bootstrap-tailscale-state \
            scripts/bootstrap-proxmox-host scripts/build-recovery-bundle \
            scripts/collect-proxmox-protected-inputs scripts/migrate-proxmox-zfs-stack \
            scripts/migrate-sops-recipients \
            scripts/prepare-omada-plan-input scripts/prepare-provider-ca-bundle scripts/publish-wolf-images \
            scripts/qualify-proxmox-lxc scripts/rehearse-recovery scripts/restore-critical-backup \
            scripts/test-recovery-tools

      - name: Validate every OpenTofu root offline from its backend
        run: |
          set -euo pipefail
          tofu fmt -check -recursive infrastructure/tofu
          for root in aws-foundation proxmox-legacy proxmox proxmox-lxc-qualification omada tailscale github; do
            tofu -chdir="infrastructure/tofu/$root" init -backend=false -input=false
            tofu -chdir="infrastructure/tofu/$root" validate
          done
          python .github/scripts/test-proxmox-legacy-retirement.py

      - name: Lint and syntax-check every Ansible playbook
        working-directory: ansible
        run: |
          set -euo pipefail
          ansible-lint -c ../.ansible-lint playbooks roles
          for playbook in playbooks/*.yml; do
            ansible-playbook -i inventory/infrastructure.yml --syntax-check "$playbook"
          done

  plan:
    name: Plan protected infrastructure
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: infrastructure-plan
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install contract-validation dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.4
      - run: bun install --frozen-lockfile

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Assume the restricted AWS plan role
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Prepare the restricted plan controller
        uses: ./.github/actions/ansible-controller
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-plan
          target-ip: docker-host
          host-key-fingerprint: ${{ vars.ARCH_SSH_HOST_KEY_FINGERPRINT }}
          accept-subnet-routes: "false"

      - name: Check out only the exact PR base contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: .local/ct-retirement-base
          sparse-checkout: |
            infrastructure/contract/home-lab.yml
            infrastructure/tofu/proxmox-lxc-qualification/.terraform.lock.hcl
          sparse-checkout-cone-mode: false

      - name: Select the reviewed CT retirement preview policy
        id: ct-retirement
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ $BASE_SHA =~ ^[0-9a-f]{40}$ ]]
          [[ $(git -C .local/ct-retirement-base rev-parse HEAD) == "$BASE_SHA" ]]
          python .github/scripts/ct-retirement.py transition \
            --base-contract .local/ct-retirement-base/infrastructure/contract/home-lab.yml \
            --head-contract infrastructure/contract/home-lab.yml \
            --qualification-tooling-commit "$BASE_SHA" \
            --qualification-provider-lock \
              .local/ct-retirement-base/infrastructure/tofu/proxmox-lxc-qualification/.terraform.lock.hcl \
            --github-output "$GITHUB_OUTPUT"

      - name: Select the reviewed Tailscale gateway-policy preview
        id: tailscale-gateway
        run: |
          set -euo pipefail
          python .github/scripts/tailscale-gateway-policy.py transition \
            --base-contract .local/ct-retirement-base/infrastructure/contract/home-lab.yml \
            --head-contract infrastructure/contract/home-lab.yml \
            --github-output "$GITHUB_OUTPUT"

      - name: Create policy-inspected saved plans
        env:
          PROXMOX_CT_DECOMMISSION_CONFIRMATION: ${{ secrets.PROXMOX_CT_DECOMMISSION_CONFIRMATION }}
          TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_recovery_bucket_region: ${{ vars.AWS_RECOVERY_REGION }}
          TF_VAR_state_bucket_name: ${{ vars.TF_BACKEND_BUCKET }}
          TF_VAR_plan_artifact_age_recipient: ${{ vars.PLAN_ARTIFACT_AGE_RECIPIENT }}
          TF_VAR_recovery_bucket_name: ${{ vars.RECOVERY_BUCKET }}
          TF_VAR_backup_principal_arn: ${{ secrets.AWS_BACKUP_PRINCIPAL_ARN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_github_repository: ${{ github.event.repository.name }}
          TF_VAR_proxmox_endpoint: ${{ vars.PROXMOX_API_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_PLAN_API_TOKEN }}
          PROXMOX_CA_PEM: ${{ secrets.PROXMOX_CA_PEM }}
          TF_VAR_use_hardware_mappings: ${{ vars.PROXMOX_HARDWARE_MAPPINGS_ENABLED || 'false' }}
          TF_VAR_manage_hardware_mappings: ${{ vars.PROXMOX_HARDWARE_MAPPINGS_ENABLED || 'false' }}
          TF_VAR_games_disk_by_id: ${{ secrets.HOMELAB_GAMES_DISK_BY_ID }}
          OMADA_URL: ${{ vars.OMADA_ENDPOINT }}
          OMADA_USERNAME: ${{ secrets.OMADA_PLAN_USERNAME }}
          OMADA_PASSWORD: ${{ secrets.OMADA_PLAN_PASSWORD }}
          OMADA_SITE: ${{ vars.OMADA_SITE }}
          TF_VAR_omada_enable_management: ${{ vars.OMADA_MANAGEMENT_ENABLED }}
          TF_VAR_adoption_complete: ${{ vars.OMADA_ADOPTION_COMPLETE }}
          OMADA_EXPORT_JSON: ${{ secrets.OMADA_EXPORT_JSON }}
          OMADA_CA_PEM: ${{ secrets.OMADA_CA_PEM }}
          SSL_CERT_FILE: ${{ github.workspace }}/.local/provider-ca/bundle.pem
          TF_VAR_tailscale_enable_management: ${{ vars.TAILSCALE_MANAGEMENT_ENABLED }}
          TAILSCALE_GATEWAY_DEVICE_ABSENCE_APPROVED: ${{ vars.TAILSCALE_GATEWAY_DEVICE_ABSENCE_APPROVED }}
          TF_VAR_github_owner_id: ${{ vars.TAILSCALE_SUBJECT_OWNER_ID }}
          TF_VAR_github_repository_id: ${{ vars.TAILSCALE_SUBJECT_REPOSITORY_ID }}
          TF_VAR_github_enable_management: ${{ vars.INFRASTRUCTURE_GITHUB_MANAGEMENT_ENABLED }}
          TF_VAR_tailscale_environment_variables_adopt_existing: false
          TF_VAR_github_repository_variables_adopt_existing: false
          TF_VAR_ruleset_import_id: ${{ vars.INFRASTRUCTURE_RULESET_IMPORT_ID }}
          TF_VAR_apply_deployment_policy_import_ids: ${{ vars.INFRASTRUCTURE_APPLY_DEPLOYMENT_POLICY_IMPORT_IDS }}
          TF_VAR_aws_plan_role_arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
          TF_VAR_aws_apply_role_arn: ${{ vars.AWS_APPLY_ROLE_ARN }}
          TF_VAR_arch_ssh_host_key_fingerprint: ${{ vars.ARCH_SSH_HOST_KEY_FINGERPRINT }}
          TF_VAR_proxmox_ssh_host_key_fingerprint: ${{ vars.PROXMOX_SSH_HOST_KEY_FINGERPRINT }}
          GITHUB_TOKEN: ${{ secrets.INFRASTRUCTURE_GITHUB_PLAN_TOKEN }}
          TAILSCALE_OAUTH_CLIENT_ID: ${{ vars.TS_PROVIDER_PLAN_CLIENT_ID }}
          TAILSCALE_AUDIENCE: ${{ vars.TS_PROVIDER_PLAN_AUDIENCE }}
        run: |
          set -euo pipefail
          ./scripts/prepare-provider-ca-bundle
          ./scripts/prepare-omada-plan-input
          ./scripts/reconcile-infrastructure plan --phase steady \
            --ct-operation '${{ steps.ct-retirement.outputs.operation }}' \
            --tailscale-gateway-operation '${{ steps.tailscale-gateway.outputs.operation }}'

  dispatch-plan:
    name: Plan dispatched infrastructure
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.INFRASTRUCTURE_APPLY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: infrastructure-plan
    steps:
      - name: Check out the exact dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install contract-validation dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.4
      - run: bun install --frozen-lockfile

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Install age from the signed Ubuntu archive
        run: |
          sudo apt-get update
          sudo apt-get install --yes age
      - name: Assume the restricted AWS plan role
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Prepare the restricted plan controller
        uses: ./.github/actions/ansible-controller
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-plan
          target-ip: docker-host
          host-key-fingerprint: ${{ vars.ARCH_SSH_HOST_KEY_FINGERPRINT }}
          accept-subnet-routes: "false"

      - name: Pin the Proxmox MagicDNS SSH identity
        run: >-
          .github/scripts/prepare-ansible-controller.sh
          proxmox
          '${{ vars.PROXMOX_SSH_HOST_KEY_FINGERPRINT }}'
          false

      - name: Create policy-inspected saved plans with restricted credentials
        env:
          PROXMOX_CT_DECOMMISSION_CONFIRMATION: ${{ secrets.PROXMOX_CT_DECOMMISSION_CONFIRMATION }}
          TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_recovery_bucket_region: ${{ vars.AWS_RECOVERY_REGION }}
          TF_VAR_state_bucket_name: ${{ vars.TF_BACKEND_BUCKET }}
          TF_VAR_plan_artifact_age_recipient: ${{ vars.PLAN_ARTIFACT_AGE_RECIPIENT }}
          TF_VAR_recovery_bucket_name: ${{ vars.RECOVERY_BUCKET }}
          TF_VAR_backup_principal_arn: ${{ secrets.AWS_BACKUP_PRINCIPAL_ARN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_github_repository: ${{ github.event.repository.name }}
          TF_VAR_proxmox_endpoint: ${{ vars.PROXMOX_API_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_PLAN_API_TOKEN }}
          PROXMOX_CA_PEM: ${{ secrets.PROXMOX_CA_PEM }}
          TF_VAR_use_hardware_mappings: ${{ vars.PROXMOX_HARDWARE_MAPPINGS_ENABLED || 'false' }}
          TF_VAR_manage_hardware_mappings: ${{ vars.PROXMOX_HARDWARE_MAPPINGS_ENABLED || 'false' }}
          TF_VAR_games_disk_by_id: ${{ secrets.HOMELAB_GAMES_DISK_BY_ID }}
          OMADA_URL: ${{ vars.OMADA_ENDPOINT }}
          OMADA_USERNAME: ${{ secrets.OMADA_PLAN_USERNAME }}
          OMADA_PASSWORD: ${{ secrets.OMADA_PLAN_PASSWORD }}
          OMADA_SITE: ${{ vars.OMADA_SITE }}
          TF_VAR_omada_enable_management: ${{ vars.OMADA_MANAGEMENT_ENABLED }}
          TF_VAR_adoption_complete: ${{ vars.OMADA_ADOPTION_COMPLETE }}
          OMADA_EXPORT_JSON: ${{ secrets.OMADA_EXPORT_JSON }}
          OMADA_CA_PEM: ${{ secrets.OMADA_CA_PEM }}
          OMADA_QUALIFICATION_OPERATION: ${{ inputs.omada_qualification || 'none' }}
          TF_VAR_qualification_network_id: ${{ secrets.OMADA_QUALIFICATION_NETWORK_ID }}
          TF_VAR_qualification_mac: ${{ secrets.OMADA_QUALIFICATION_MAC }}
          TF_VAR_qualification_ip: ${{ secrets.OMADA_QUALIFICATION_IP }}
          SSL_CERT_FILE: ${{ github.workspace }}/.local/provider-ca/bundle.pem
          TF_VAR_tailscale_enable_management: ${{ vars.TAILSCALE_MANAGEMENT_ENABLED }}
          TAILSCALE_GATEWAY_DEVICE_ABSENCE_APPROVED: ${{ vars.TAILSCALE_GATEWAY_DEVICE_ABSENCE_APPROVED }}
          TF_VAR_github_owner_id: ${{ vars.TAILSCALE_SUBJECT_OWNER_ID }}
          TF_VAR_github_repository_id: ${{ vars.TAILSCALE_SUBJECT_REPOSITORY_ID }}
          TF_VAR_github_enable_management: ${{ vars.INFRASTRUCTURE_GITHUB_MANAGEMENT_ENABLED }}
          TF_VAR_tailscale_environment_variables_adopt_existing: ${{ inputs.phase == 'adoption' }}
          TF_VAR_github_repository_variables_adopt_existing: ${{ inputs.phase == 'adoption' }}
          TF_VAR_ruleset_import_id: ${{ vars.INFRASTRUCTURE_RULESET_IMPORT_ID }}
          TF_VAR_apply_deployment_policy_import_ids: ${{ vars.INFRASTRUCTURE_APPLY_DEPLOYMENT_POLICY_IMPORT_IDS }}
          TF_VAR_aws_plan_role_arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
          TF_VAR_aws_apply_role_arn: ${{ vars.AWS_APPLY_ROLE_ARN }}
          TF_VAR_arch_ssh_host_key_fingerprint: ${{ vars.ARCH_SSH_HOST_KEY_FINGERPRINT }}
          TF_VAR_proxmox_ssh_host_key_fingerprint: ${{ vars.PROXMOX_SSH_HOST_KEY_FINGERPRINT }}
          GITHUB_TOKEN: ${{ secrets.INFRASTRUCTURE_GITHUB_PLAN_TOKEN }}
          TAILSCALE_OAUTH_CLIENT_ID: ${{ vars.TS_PROVIDER_PLAN_CLIENT_ID }}
          TAILSCALE_AUDIENCE: ${{ vars.TS_PROVIDER_PLAN_AUDIENCE }}
        run: |
          set -euo pipefail
          ./scripts/prepare-provider-ca-bundle
          ./scripts/prepare-omada-plan-input
          migration_args=()
          if [[ '${{ inputs.network_migration }}' == true ]]; then
            migration_args+=(--network-migration)
          fi
          ./scripts/reconcile-infrastructure plan --phase '${{ inputs.phase }}' \
            --ct-operation '${{ inputs.ct_retirement }}' \
            --tailscale-gateway-operation '${{ inputs.tailscale_gateway }}' "${migration_args[@]}"

      - name: Encrypt the exact saved-plan bundle
        env:
          PLAN_ARTIFACT_AGE_RECIPIENT: ${{ vars.PLAN_ARTIFACT_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          [[ $PLAN_ARTIFACT_AGE_RECIPIENT =~ ^age1[0-9a-z]+$ ]]
          tar -C .reconcile -cf .reconcile/infrastructure-plans.tar plans
          age --encrypt --recipient "$PLAN_ARTIFACT_AGE_RECIPIENT" \
            --output .reconcile/infrastructure-plans.tar.age \
            .reconcile/infrastructure-plans.tar
          rm -rf .reconcile/plans .reconcile/infrastructure-plans.tar

      - name: Upload the encrypted saved-plan bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: infrastructure-plans-${{ github.run_id }}
          path: .reconcile/infrastructure-plans.tar.age
          if-no-files-found: error
          retention-days: 1

  reconcile:
    name: Apply exact plans and prove no-op
    needs:
      - validate
      - dispatch-plan
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.INFRASTRUCTURE_APPLY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: infrastructure-apply
    steps:
      - name: Check out the exact dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install contract-validation dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.4
      - run: bun install --frozen-lockfile

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Install age from the signed Ubuntu archive
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Download the encrypted saved-plan bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: infrastructure-plans-${{ github.run_id }}
          path: .reconcile

      - name: Decrypt and safely extract the saved-plan bundle
        env:
          PLAN_ARTIFACT_AGE_KEY: ${{ secrets.PLAN_ARTIFACT_AGE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 .local .reconcile
          printf '%s\n' "$PLAN_ARTIFACT_AGE_KEY" >.local/plan-artifact-age.key
          chmod 0600 .local/plan-artifact-age.key
          age --decrypt --identity .local/plan-artifact-age.key \
            --output .local/infrastructure-plans.tar \
            .reconcile/infrastructure-plans.tar.age
          python3 - <<'PY'
          import tarfile
          from pathlib import Path, PurePosixPath

          archive = Path('.local/infrastructure-plans.tar')
          destination = Path('.reconcile')
          with tarfile.open(archive) as bundle:
              members = bundle.getmembers()
              if not members:
                  raise SystemExit('saved-plan archive is empty')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not path.parts or path.parts[0] != 'plans':
                      raise SystemExit('saved-plan archive contains an unsafe path')
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit('saved-plan archive contains a non-regular entry')
              bundle.extractall(destination, members=members, filter='data')
          PY
          rm -f .local/plan-artifact-age.key .local/infrastructure-plans.tar \
            .reconcile/infrastructure-plans.tar.age

      - name: Assume the restricted AWS apply role
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Prepare the restricted apply controller
        uses: ./.github/actions/ansible-controller
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-apply
          target-ip: docker-host
          host-key-fingerprint: ${{ vars.ARCH_SSH_HOST_KEY_FINGERPRINT }}
          accept-subnet-routes: "false"

      - name: Pin the Proxmox MagicDNS SSH identity
        run: >-
          .github/scripts/prepare-ansible-controller.sh
          proxmox
          '${{ vars.PROXMOX_SSH_HOST_KEY_FINGERPRINT }}'
          false

      - name: Apply the exact saved plans and audit
        env:
          PROXMOX_CT_DECOMMISSION_CONFIRMATION: ${{ secrets.PROXMOX_CT_DECOMMISSION_CONFIRMATION }}
          TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_recovery_bucket_region: ${{ vars.AWS_RECOVERY_REGION }}
          TF_VAR_state_bucket_name: ${{ vars.TF_BACKEND_BUCKET }}
          TF_VAR_plan_artifact_age_recipient: ${{ vars.PLAN_ARTIFACT_AGE_RECIPIENT }}
          TF_VAR_recovery_bucket_name: ${{ vars.RECOVERY_BUCKET }}
          TF_VAR_backup_principal_arn: ${{ secrets.AWS_BACKUP_PRINCIPAL_ARN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_github_repository: ${{ github.event.repository.name }}
          TF_VAR_proxmox_endpoint: ${{ vars.PROXMOX_API_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_PLAN_API_TOKEN }}
          PROXMOX_CA_PEM: ${{ secrets.PROXMOX_CA_PEM }}
          PROXMOX_APPLY_API_TOKEN: ${{ secrets.PROXMOX_APPLY_API_TOKEN }}
          TF_VAR_use_hardware_mappings: ${{ vars.PROXMOX_HARDWARE_MAPPINGS_ENABLED || 'false' }}
          TF_VAR_manage_hardware_mappings: ${{ vars.PROXMOX_HARDWARE_MAPPINGS_ENABLED || 'false' }}
          TF_VAR_games_disk_by_id: ${{ secrets.HOMELAB_GAMES_DISK_BY_ID }}
          OMADA_URL: ${{ vars.OMADA_ENDPOINT }}
          OMADA_USERNAME: ${{ secrets.OMADA_PLAN_USERNAME }}
          OMADA_PASSWORD: ${{ secrets.OMADA_PLAN_PASSWORD }}
          OMADA_APPLY_USERNAME: ${{ secrets.OMADA_APPLY_USERNAME }}
          OMADA_APPLY_PASSWORD: ${{ secrets.OMADA_APPLY_PASSWORD }}
          OMADA_SITE: ${{ vars.OMADA_SITE }}
          TF_VAR_omada_enable_management: ${{ vars.OMADA_MANAGEMENT_ENABLED }}
          TF_VAR_adoption_complete: ${{ vars.OMADA_ADOPTION_COMPLETE }}
          OMADA_EXPORT_JSON: ${{ secrets.OMADA_EXPORT_JSON }}
          OMADA_CA_PEM: ${{ secrets.OMADA_CA_PEM }}
          OMADA_QUALIFICATION_OPERATION: ${{ inputs.omada_qualification || 'none' }}
          TF_VAR_qualification_network_id: ${{ secrets.OMADA_QUALIFICATION_NETWORK_ID }}
          TF_VAR_qualification_mac: ${{ secrets.OMADA_QUALIFICATION_MAC }}
          TF_VAR_qualification_ip: ${{ secrets.OMADA_QUALIFICATION_IP }}
          SSL_CERT_FILE: ${{ github.workspace }}/.local/provider-ca/bundle.pem
          TF_VAR_tailscale_enable_management: ${{ vars.TAILSCALE_MANAGEMENT_ENABLED }}
          TAILSCALE_GATEWAY_DEVICE_ABSENCE_APPROVED: ${{ vars.TAILSCALE_GATEWAY_DEVICE_ABSENCE_APPROVED }}
          TF_VAR_github_owner_id: ${{ vars.TAILSCALE_SUBJECT_OWNER_ID }}
          TF_VAR_github_repository_id: ${{ vars.TAILSCALE_SUBJECT_REPOSITORY_ID }}
          TF_VAR_github_enable_management: ${{ vars.INFRASTRUCTURE_GITHUB_MANAGEMENT_ENABLED }}
          TF_VAR_tailscale_environment_variables_adopt_existing: ${{ inputs.phase == 'adoption' }}
          TF_VAR_github_repository_variables_adopt_existing: ${{ inputs.phase == 'adoption' }}
          TF_VAR_ruleset_import_id: ${{ vars.INFRASTRUCTURE_RULESET_IMPORT_ID }}
          TF_VAR_apply_deployment_policy_import_ids: ${{ vars.INFRASTRUCTURE_APPLY_DEPLOYMENT_POLICY_IMPORT_IDS }}
          TF_VAR_aws_plan_role_arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
          TF_VAR_aws_apply_role_arn: ${{ vars.AWS_APPLY_ROLE_ARN }}
          TF_VAR_arch_ssh_host_key_fingerprint: ${{ vars.ARCH_SSH_HOST_KEY_FINGERPRINT }}
          TF_VAR_proxmox_ssh_host_key_fingerprint: ${{ vars.PROXMOX_SSH_HOST_KEY_FINGERPRINT }}
          GITHUB_TOKEN: ${{ secrets.INFRASTRUCTURE_GITHUB_PLAN_TOKEN }}
          GITHUB_APPLY_TOKEN: ${{ secrets.INFRASTRUCTURE_GITHUB_APPLY_TOKEN }}
          TAILSCALE_OAUTH_CLIENT_ID: ${{ vars.TS_PROVIDER_APPLY_CLIENT_ID }}
          TAILSCALE_AUDIENCE: ${{ vars.TS_PROVIDER_APPLY_AUDIENCE }}
          TAILSCALE_APPLY_OAUTH_CLIENT_ID: ${{ vars.TS_PROVIDER_APPLY_CLIENT_ID }}
          TAILSCALE_APPLY_AUDIENCE: ${{ vars.TS_PROVIDER_APPLY_AUDIENCE }}
          HOMELAB_GAMES_DISK_BY_ID: ${{ secrets.HOMELAB_GAMES_DISK_BY_ID }}
          HOMELAB_ZIGBEE_USB_SERIAL: ${{ secrets.HOMELAB_ZIGBEE_USB_SERIAL }}
          HOMELAB_ZWAVE_USB_SERIAL: ${{ secrets.HOMELAB_ZWAVE_USB_SERIAL }}
          HOMELAB_ZFS_POOL_GUID: ${{ secrets.HOMELAB_ZFS_POOL_GUID }}
          HOMELAB_ZFS_MEMBER_01_BY_ID: ${{ secrets.HOMELAB_ZFS_MEMBER_01_BY_ID }}
          HOMELAB_ZFS_MEMBER_02_BY_ID: ${{ secrets.HOMELAB_ZFS_MEMBER_02_BY_ID }}
          HOMELAB_ZFS_MEMBER_03_BY_ID: ${{ secrets.HOMELAB_ZFS_MEMBER_03_BY_ID }}
          HOMELAB_ZFS_MEMBER_04_BY_ID: ${{ secrets.HOMELAB_ZFS_MEMBER_04_BY_ID }}
          HOMELAB_ZFS_MEMBER_05_BY_ID: ${{ secrets.HOMELAB_ZFS_MEMBER_05_BY_ID }}
          HOMELAB_ZFS_MEMBER_06_BY_ID: ${{ secrets.HOMELAB_ZFS_MEMBER_06_BY_ID }}
          HOMELAB_ZFS_MEMBER_07_BY_ID: ${{ secrets.HOMELAB_ZFS_MEMBER_07_BY_ID }}
          HOMELAB_ZFS_MEMBER_08_BY_ID: ${{ secrets.HOMELAB_ZFS_MEMBER_08_BY_ID }}
          HOMELAB_ZFS_MEMBER_09_BY_ID: ${{ secrets.HOMELAB_ZFS_MEMBER_09_BY_ID }}
          HOMELAB_ZFS_MEMBER_10_BY_ID: ${{ secrets.HOMELAB_ZFS_MEMBER_10_BY_ID }}
          HOMELAB_ZFS_MEMBER_11_BY_ID: ${{ secrets.HOMELAB_ZFS_MEMBER_11_BY_ID }}
          HOMELAB_ZFS_MEMBER_12_BY_ID: ${{ secrets.HOMELAB_ZFS_MEMBER_12_BY_ID }}
          ARCH_SSH_ACCESS_PROVEN: ${{ vars.ARCH_SSH_ACCESS_PROVEN }}
          PROXMOX_SSH_ACCESS_PROVEN: ${{ vars.PROXMOX_SSH_ACCESS_PROVEN }}
          ZFS_VERSION_MIGRATION_REVIEWED: ${{ vars.ZFS_VERSION_MIGRATION_REVIEWED }}
          IMAGE_LOCK_BOOTSTRAP_CONFIRMED: ${{ vars.IMAGE_LOCK_BOOTSTRAP_CONFIRMED }}
          PROXMOX_STEADY_APPLY_CONFIRMED: ${{ vars.PROXMOX_STEADY_APPLY_CONFIRMED }}
          PROXMOX_PASSTHROUGH_APPLY_CONFIRMED: ${{ vars.PROXMOX_PASSTHROUGH_APPLY_CONFIRMED }}
          RECOVERY_CONSOLE_CONFIRMED: ${{ vars.RECOVERY_CONSOLE_CONFIRMED }}
          LAN_ROLLBACK_CONFIRMED: ${{ vars.LAN_ROLLBACK_CONFIRMED }}
          ARCH_NETWORK_RESTART_CONFIRMED: ${{ vars.ARCH_NETWORK_RESTART_CONFIRMED }}
          RECONCILE_ANSIBLE_EXTRA_VARS_FILE: .local/reconcile-extra-vars.json
        run: |
          set -euo pipefail
          ./scripts/prepare-omada-plan-input
          ./scripts/prepare-provider-ca-bundle
          install -d -m 0700 .local
          jq -n \
            --arg arch "$ARCH_SSH_ACCESS_PROVEN" \
            --arg proxmox "$PROXMOX_SSH_ACCESS_PROVEN" \
            --arg zfs "$ZFS_VERSION_MIGRATION_REVIEWED" \
            --arg locks "$IMAGE_LOCK_BOOTSTRAP_CONFIRMED" \
            --arg pve_apply "$PROXMOX_STEADY_APPLY_CONFIRMED" \
            --arg passthrough "$PROXMOX_PASSTHROUGH_APPLY_CONFIRMED" \
            --arg console "$RECOVERY_CONSOLE_CONFIRMED" \
            --arg lan "$LAN_ROLLBACK_CONFIRMED" \
            --arg arch_network "$ARCH_NETWORK_RESTART_CONFIRMED" \
            '{arch_ssh_access_proven: ($arch == "true"),
              proxmox_ssh_access_proven: ($proxmox == "true"),
              proxmox_storage_version_migration_reviewed: ($zfs == "true"),
              maintenance_image_lock_bootstrap_confirmed: ($locks == "true"),
              proxmox_steady_apply_confirmed: ($pve_apply == "true"),
              proxmox_passthrough_apply_confirmed: ($passthrough == "true"),
              recovery_console_confirmed: ($console == "true"),
              lan_rollback_confirmed: ($lan == "true"),
              arch_network_restart_confirmed: ($arch_network == "true")}' \
            >"$RECONCILE_ANSIBLE_EXTRA_VARS_FILE"
          chmod 0600 "$RECONCILE_ANSIBLE_EXTRA_VARS_FILE"
          migration_args=()
          if [[ '${{ inputs.network_migration }}' == true ]]; then
            migration_args+=(--network-migration)
          fi
          ./scripts/reconcile-infrastructure apply --phase '${{ inputs.phase }}' \
            --ct-operation '${{ inputs.ct_retirement }}' \
            --tailscale-gateway-operation '${{ inputs.tailscale_gateway }}' \
            --proxmox-inventory inventory/infrastructure.yml \
            --arch-inventory inventory/production.yml "${migration_args[@]}"
