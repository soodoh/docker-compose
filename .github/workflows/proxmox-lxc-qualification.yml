---
name: Qualify disposable Proxmox LXC lifecycle

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Run exactly one isolated LXC qualification operation
        required: true
        type: choice
        options:
          - create
          - probe-protected-delete
          - verify-protected
          - unprotect
          - delete
          - verify-empty
          - reprotect
          - inspect-recovery
          - recover-lock

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: infrastructure-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  plan:
    name: Create exact qualification plan
    if: github.ref == 'refs/heads/main' && inputs.operation != 'inspect-recovery' && inputs.operation != 'recover-lock'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: infrastructure-plan
    steps:
      - name: Check out the exact dispatched main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install contract dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.4
      - run: bun install --frozen-lockfile

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Install age from the signed Ubuntu archive
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Assume the restricted AWS plan role
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Prepare the restricted plan controller
        uses: ./.github/actions/ansible-controller
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-plan
          target-ip: docker-host
          host-key-fingerprint: ${{ vars.ARCH_SSH_HOST_KEY_FINGERPRINT }}
          accept-subnet-routes: "false"

      - name: Create the policy-inspected saved plan
        env:
          TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_VAR_proxmox_endpoint: ${{ vars.PROXMOX_API_ENDPOINT }}
          TF_VAR_qualification_vm_id: ${{ secrets.PROXMOX_LXC_QUALIFICATION_VMID }}
          TF_VAR_qualification_template_file_id: ${{ secrets.PROXMOX_LXC_QUALIFICATION_TEMPLATE_FILE_ID }}
          PROXMOX_PLAN_API_TOKEN: ${{ secrets.PROXMOX_PLAN_API_TOKEN }}
          PROXMOX_CA_PEM: ${{ secrets.PROXMOX_CA_PEM }}
          SSL_CERT_FILE: ${{ github.workspace }}/.local/provider-ca/bundle.pem
        run: |
          set -euo pipefail
          ./scripts/prepare-provider-ca-bundle
          ./scripts/qualify-proxmox-lxc plan '${{ inputs.operation }}'

      - name: Encrypt and remove the plaintext saved-plan bundle
        env:
          PLAN_ARTIFACT_AGE_RECIPIENT: ${{ vars.PLAN_ARTIFACT_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          [[ $PLAN_ARTIFACT_AGE_RECIPIENT =~ ^age1[0-9a-z]+$ ]]
          tar -C .reconcile -cf .local/lxc-qualification.tar lxc-qualification
          age --encrypt --recipient "$PLAN_ARTIFACT_AGE_RECIPIENT" \
            --output .reconcile/lxc-qualification.tar.age \
            .local/lxc-qualification.tar
          rm -rf .reconcile/lxc-qualification .local/lxc-qualification.tar

      - name: Upload only the encrypted saved-plan bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: proxmox-lxc-qualification-${{ github.run_id }}
          path: .reconcile/lxc-qualification.tar.age
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply exact qualification plan and prove identity
    needs: plan
    if: github.ref == 'refs/heads/main' && inputs.operation != 'inspect-recovery' && inputs.operation != 'recover-lock'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: infrastructure-apply
    steps:
      - name: Check out the exact dispatched main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install contract dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.4
      - run: bun install --frozen-lockfile

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Install age from the signed Ubuntu archive
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Download the encrypted saved-plan bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: proxmox-lxc-qualification-${{ github.run_id }}
          path: .reconcile

      - name: Decrypt and safely extract the saved-plan bundle
        env:
          PLAN_ARTIFACT_AGE_KEY: ${{ secrets.PLAN_ARTIFACT_AGE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 .local .reconcile
          printf '%s\n' "$PLAN_ARTIFACT_AGE_KEY" >.local/plan-artifact-age.key
          chmod 0600 .local/plan-artifact-age.key
          age --decrypt --identity .local/plan-artifact-age.key \
            --output .local/lxc-qualification.tar \
            .reconcile/lxc-qualification.tar.age
          python3 - <<'PY'
          import tarfile
          from pathlib import Path, PurePosixPath

          archive = Path(".local/lxc-qualification.tar")
          with tarfile.open(archive) as bundle:
              members = bundle.getmembers()
              if not members:
                  raise SystemExit("qualification saved-plan archive is empty")
              for member in members:
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or not path.parts
                      or path.parts[0] != "lxc-qualification"
                      or not (member.isfile() or member.isdir())
                  ):
                      raise SystemExit("qualification saved-plan archive contains an unsafe entry")
              bundle.extractall(".reconcile", members=members, filter="data")
          PY
          rm -f .local/plan-artifact-age.key .local/lxc-qualification.tar \
            .reconcile/lxc-qualification.tar.age

      - name: Assume the restricted AWS apply role
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Prepare the restricted apply controller
        uses: ./.github/actions/ansible-controller
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-apply
          target-ip: docker-host
          host-key-fingerprint: ${{ vars.ARCH_SSH_HOST_KEY_FINGERPRINT }}
          accept-subnet-routes: "false"

      - name: Apply one exact operation and prove the postcondition
        env:
          TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_VAR_proxmox_endpoint: ${{ vars.PROXMOX_API_ENDPOINT }}
          TF_VAR_qualification_vm_id: ${{ secrets.PROXMOX_LXC_QUALIFICATION_VMID }}
          TF_VAR_qualification_template_file_id: ${{ secrets.PROXMOX_LXC_QUALIFICATION_TEMPLATE_FILE_ID }}
          PROXMOX_PLAN_API_TOKEN: ${{ secrets.PROXMOX_PLAN_API_TOKEN }}
          PROXMOX_APPLY_API_TOKEN: ${{ secrets.PROXMOX_APPLY_API_TOKEN }}
          PROXMOX_CA_PEM: ${{ secrets.PROXMOX_CA_PEM }}
          SSL_CERT_FILE: ${{ github.workspace }}/.local/provider-ca/bundle.pem
        run: |
          set -euo pipefail
          ./scripts/prepare-provider-ca-bundle
          ./scripts/qualify-proxmox-lxc apply '${{ inputs.operation }}'

  inspect-recovery:
    name: Inspect qualification recovery state without mutation
    if: github.ref == 'refs/heads/main' && inputs.operation == 'inspect-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: infrastructure-plan
    steps:
      - name: Check out the exact dispatched main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install contract dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.4
      - run: bun install --frozen-lockfile

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Assume the restricted AWS plan role
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Prepare the restricted read-only controller
        uses: ./.github/actions/ansible-controller
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-plan
          target-ip: docker-host
          host-key-fingerprint: ${{ vars.ARCH_SSH_HOST_KEY_FINGERPRINT }}
          accept-subnet-routes: "false"

      - name: Report only the sanitized recovery classification
        env:
          TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_VAR_proxmox_endpoint: ${{ vars.PROXMOX_API_ENDPOINT }}
          TF_VAR_qualification_vm_id: ${{ secrets.PROXMOX_LXC_QUALIFICATION_VMID }}
          TF_VAR_qualification_template_file_id: ${{ secrets.PROXMOX_LXC_QUALIFICATION_TEMPLATE_FILE_ID }}
          PROXMOX_PLAN_API_TOKEN: ${{ secrets.PROXMOX_PLAN_API_TOKEN }}
          PROXMOX_CA_PEM: ${{ secrets.PROXMOX_CA_PEM }}
          SSL_CERT_FILE: ${{ github.workspace }}/.local/provider-ca/bundle.pem
        run: |
          set -euo pipefail
          ./scripts/prepare-provider-ca-bundle
          ./scripts/qualify-proxmox-lxc inspect-recovery


  recover-lock:
    name: Recover exact stale qualification locks
    if: github.ref == 'refs/heads/main' && inputs.operation == 'recover-lock'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: infrastructure-apply
    steps:
      - name: Check out the exact dispatched main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install contract dependencies
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.4
      - run: bun install --frozen-lockfile

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Assume the restricted AWS apply role
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Prepare the restricted read-only controller
        uses: ./.github/actions/ansible-controller
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-plan
          target-ip: docker-host
          host-key-fingerprint: ${{ vars.ARCH_SSH_HOST_KEY_FINGERPRINT }}
          accept-subnet-routes: "false"

      - name: Recover only locks from the exact reviewed failed run
        env:
          GH_TOKEN: ${{ github.token }}
          TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_VAR_proxmox_endpoint: ${{ vars.PROXMOX_API_ENDPOINT }}
          TF_VAR_qualification_vm_id: ${{ secrets.PROXMOX_LXC_QUALIFICATION_VMID }}
          TF_VAR_qualification_template_file_id: ${{ secrets.PROXMOX_LXC_QUALIFICATION_TEMPLATE_FILE_ID }}
          PROXMOX_PLAN_API_TOKEN: ${{ secrets.PROXMOX_PLAN_API_TOKEN }}
          PROXMOX_APPLY_API_TOKEN: ${{ secrets.PROXMOX_APPLY_API_TOKEN }}
          PROXMOX_CA_PEM: ${{ secrets.PROXMOX_CA_PEM }}
          PROXMOX_LXC_QUALIFICATION_RECOVERY_RUN_ID: ${{ secrets.PROXMOX_LXC_QUALIFICATION_RECOVERY_RUN_ID }}
          PROXMOX_LXC_QUALIFICATION_RECOVERY_LOCK_SHA256: ${{ secrets.PROXMOX_LXC_QUALIFICATION_RECOVERY_LOCK_SHA256 }}
          SSL_CERT_FILE: ${{ github.workspace }}/.local/provider-ca/bundle.pem
        run: |
          set -euo pipefail
          ./scripts/prepare-provider-ca-bundle
          ./scripts/qualify-proxmox-lxc recover-lock
