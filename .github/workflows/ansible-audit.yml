name: Ansible remote audit

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ansible-production
  cancel-in-progress: false

jobs:
  audit:
    name: Audit Docker host over Tailscale
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: infrastructure-plan

    env:
      ANSIBLE_FORCE_COLOR: "true"
      ANSIBLE_HOST_KEY_CHECKING: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare the restricted manual-audit controller
        uses: ./.github/actions/ansible-controller
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          target-ip: 100.111.210.72
          host-key-fingerprint: SHA256:2wHl3xsBkNYprqP99usjZdwj2Rytcc+MtJVErhowVYw
          accept-subnet-routes: "true"

      - name: Validate the production inventory and audit syntax
        working-directory: ansible
        run: |
          ansible-inventory -i inventory/production.yml --graph
          ansible-playbook -i inventory/production.yml \
            --syntax-check playbooks/audit.yml

      - name: Verify remote Ansible connectivity
        working-directory: ansible
        run: |
          ansible -i inventory/production.yml docker_host \
            -m ansible.builtin.ping

      - name: Run the remote read-only audit
        working-directory: ansible
        run: |
          ansible-playbook -i inventory/production.yml \
            playbooks/audit.yml --check --diff
