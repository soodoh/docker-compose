---
- name: Check or converge the approved Docker host state
  hosts: docker_host
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  pre_tasks:
    - name: Enforce the apply safety contract
      ansible.builtin.import_role:
        name: apply_guard
      tags:
        - always

    - name: Acquire the host-side production apply lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        iac_apply_lock_action: acquire
      tags:
        - always
  roles:
    - role: host_files
      tags:
        - host_files
    - role: base
      tags:
        - base
    - role: maintenance
      tags:
        - maintenance
    - role: storage
      tags:
        - storage
    - role: hardware
      tags:
        - hardware
    - role: docker
      tags:
        - docker
    - role: compose
      tags:
        - compose
    - role: health
      tags:
        - health
  post_tasks:
    - name: Release the host-side production apply lock after success
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        iac_apply_lock_action: release
      tags:
        - always
