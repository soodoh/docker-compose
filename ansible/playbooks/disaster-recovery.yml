---
- name: Verify explicitly selected critical-data recovery
  hosts: docker_host
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../../infrastructure/contract/home-lab.yml"
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  pre_tasks:
    - name: Validate destructive recovery gates
      ansible.builtin.assert:
        that:
          - >-
            (
              (recovery_local_rehearsal_source | default('') | length == 0) and
              (recovery_backup_id | default('') is match('^(daily-remote-backup|weekly-backup)-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}\\.tar\\.gz\\.gpg$')) and
              (recovery_backup_url | default('') is match('^https://')) and
              (recovery_backup_version_id | default('') is match('^[A-Za-z0-9._~+-]{1,1024}$'))
            ) or (
              (recovery_local_rehearsal_source | default('') is match('^/mnt/storage/backups/(daily-local-backup|daily-backup)-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}\\.tar\\.gz\\.gpg$')) and
              (recovery_backup_id | default('') is match('^(daily-local-backup|daily-backup)-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}\\.tar\\.gz\\.gpg$')) and
              (recovery_local_rehearsal_confirmation | default('') == 'use-reviewed-local-backup-without-s3-download')
            )
          - recovery_backup_sha256 | default('') is match('^[0-9a-f]{64}$')
          - recovery_restore_confirmed | default(false) | bool
          - recovery_target_approved_empty | default(false) | bool
          - recovery_target | default('') is match('^/srv/home-lab-recovery/[A-Za-z0-9._-]+$')
          - not (recovery_retain_existing_bind_data | default(false) | bool) or (recovery_retained_bind_review_confirmed | default(false) | bool)
        fail_msg: "Recovery requires an exact immutable backup, checksum, and explicit target/restore/retained-bind approval."

    - name: Acquire the shared host-side mutation lock
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: acquire
        apply_lock_operation: disaster-recovery
  tasks:
    - name: Create protected recovery helper directory
      ansible.builtin.file:
        path: /usr/local/libexec
        state: directory
        owner: root
        group: root
        mode: "0755"
    - name: Install the reviewed safe archive extractor
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../scripts/restore-critical-archive.py"
        dest: /usr/local/libexec/home-lab-restore-critical-archive.py
        owner: root
        group: root
        mode: "0755"
    - name: Create the exact approved empty recovery target
      ansible.builtin.file:
        path: "{{ recovery_target }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      no_log: true
    - name: Restore only the exact verified backup
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/../../scripts/restore-critical-backup
          --backup-id {{ recovery_backup_id | quote }}
          {{ ('--local-rehearsal-source ' ~ (recovery_local_rehearsal_source | quote)) if (recovery_local_rehearsal_source | default('') | length > 0) else '' }}
          --confirmed-empty-target
      register: disaster_recovery_restore
      no_log: true
      environment:
        RECOVERY_BACKUP_URL: "{{ recovery_backup_url | default('') }}"
        RECOVERY_BACKUP_VERSION_ID: "{{ recovery_backup_version_id | default('') }}"
        RECOVERY_BACKUP_SHA256: "{{ recovery_backup_sha256 }}"
        RECOVERY_TARGET: "{{ recovery_target }}"
        RECOVERY_GPG_KEY_FILE: "{{ recovery_gpg_key_file }}"
        RECOVERY_GPG_PASSPHRASE_FILE: "{{ recovery_gpg_passphrase_file | default('') }}"
        RECOVERY_LOCAL_REHEARSAL_CONFIRMED: "{{ recovery_local_rehearsal_confirmation | default('') }}"
        RECOVERY_STATUS_FILE: /run/home-lab-recovery-restore-status

  post_tasks:
    - name: Release the shared host-side mutation lock after success
      ansible.builtin.import_role:
        name: apply_lock
      vars:
        apply_lock_action: release
