---
- name: Bootstrap the unprivileged automatic-plan controller identity
  hosts: docker_host
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/docker_host.yml"
  pre_tasks:
    - name: Enforce the management-plane apply safety contract
      ansible.builtin.import_role:
        name: apply_guard
      vars:
        iac_allowed_apply_tags: "{{ bootstrap_allowed_apply_tags }}"
      tags:
        - always
        - management_plane
  roles:
    - role: plan_controller
      tags:
        - management_plane
