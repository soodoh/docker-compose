---
- name: Keep approved base packages present without upgrades
  ansible.builtin.include_role:
    name: pacman_packages
  vars:
    pacman_packages_requested: "{{ base_packages }}"

- name: Keep approved base services enabled and started without restarting them
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: false
  become: "{{ not ansible_check_mode }}"
  loop: "{{ base_services }}"
