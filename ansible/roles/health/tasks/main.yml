---
- name: List running Compose services
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - compose
      - ps
      - --status
      - running
      - --services
    chdir: "{{ audit_compose_project_dir }}"
  register: health_running_services
  changed_when: false
  check_mode: false

- name: Assert all adopted Compose services remain running
  ansible.builtin.assert:
    that:
      - health_running_services.stdout_lines | length == audit_expected_compose_service_count
    fail_msg: "One or more adopted Compose services are not running."

- name: Inspect known health blockers without exposing container configuration
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - inspect
      - --format
      - "{{ audit_container_health_format }}"
      - "{{ item.key }}"
  register: health_blocker_results
  loop: "{{ audit_expected_health | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  check_mode: false

- name: Assert known health blockers have not drifted
  ansible.builtin.assert:
    that:
      - item.stdout == item.item.key ~ '|running|' ~ item.item.value
    fail_msg: "{{ item.item.key }} state or health changed; review before convergence."
  loop: "{{ health_blocker_results.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Report unresolved Compose adoption blockers
  ansible.builtin.debug:
    msg: >-
      Gluetun and Seerr remain unhealthy. This check records current state only and does not waive the
      Phase 8 health gate.
