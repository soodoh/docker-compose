---
- name: Keep the unprivileged automatic-plan account present
  ansible.builtin.include_role:
    name: deploy_user
  vars:
    controller_user_name: "{{ plan_user_name }}"
    controller_user_comment: Ansible automatic plan user
    controller_user_home: "{{ plan_user_home }}"
    controller_user_shell: "{{ plan_user_shell }}"
    controller_user_sudoers_path: "{{ plan_user_sudoers_path }}"
    controller_user_sudoers_content: "{{ plan_user_sudoers_content }}"

- name: Report the fixed read-only helper in check mode
  ansible.builtin.debug:
    msg: >-
      A normal approved bootstrap will install {{ plan_user_docker_version_helper }} as root:root mode 0755.
      It accepts no arguments and runs only the fixed Docker version query.
  when: ansible_check_mode

- name: Install the fixed read-only Docker version helper
  ansible.builtin.copy:
    src: iac-read-docker-version
    dest: "{{ plan_user_docker_version_helper }}"
    owner: root
    group: root
    mode: "0755"
    backup: false
  become: true
  when: not ansible_check_mode

- name: Verify the plan user can run only the fixed Docker version helper
  ansible.builtin.command:
    argv:
      - /usr/bin/sudo
      - --user={{ plan_user_name }}
      - --
      - /usr/bin/sudo
      - --non-interactive
      - --
      - "{{ plan_user_docker_version_helper }}"
  become: true
  register: plan_user_helper_result
  changed_when: false
  when: not ansible_check_mode

- name: Verify broad passwordless sudo remains denied
  ansible.builtin.command:
    argv:
      - /usr/bin/sudo
      - --user={{ plan_user_name }}
      - --
      - /usr/bin/sudo
      - --non-interactive
      - --
      - /usr/bin/true
  become: true
  register: plan_user_broad_sudo_result
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert the automatic-plan privilege boundary
  ansible.builtin.assert:
    that:
      - plan_user_helper_result.stdout == audit_expected_docker_client_version ~ '|' ~ audit_expected_docker_server_version
      - plan_user_broad_sudo_result.rc != 0
    fail_msg: >-
      The automatic-plan account must run the fixed read-only helper and must not have general passwordless sudo.
  when: not ansible_check_mode
