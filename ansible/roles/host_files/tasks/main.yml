---
- name: Preserve approved Wolf host files exactly
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ item.source }}"
    dest: "{{ item.destination }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    force: true
    backup: false
  diff: false
  become: "{{ not ansible_check_mode }}"
  loop: "{{ managed_host_files }}"
  loop_control:
    label: "{{ item.destination }}"
