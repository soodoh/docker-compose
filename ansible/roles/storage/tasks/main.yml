---
- name: Verify adopted fstab entries without managing them
  ansible.builtin.command:
    argv:
      - /usr/bin/grep
      - --fixed-strings
      - --line-regexp
      - --
      - "{{ item }}"
      - /etc/fstab
  loop: "{{ audit_expected_fstab_entries }}"
  loop_control:
    label: "{{ item.split()[1] }}"
  changed_when: false
  check_mode: false

- name: Inspect adopted mount source and filesystem type
  ansible.builtin.command:
    argv:
      - /usr/bin/findmnt
      - --noheadings
      - --output
      - SOURCE,FSTYPE
      - --target
      - "{{ item.path }}"
  register: storage_mount_results
  loop: "{{ audit_expected_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  changed_when: false
  check_mode: false

- name: Assert adopted mounts remain available and unchanged
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout.split() | first == item.item.source
      - item.stdout.split() | last == item.item.fstype
    fail_msg: "Required mount {{ item.item.path }} differs or is unavailable; refusing convergence."
  loop: "{{ storage_mount_results.results }}"
  loop_control:
    label: "{{ item.item.path }}"
