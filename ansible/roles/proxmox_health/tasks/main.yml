---
- name: Verify the Proxmox API responds locally
  ansible.builtin.uri:
    url: https://127.0.0.1:8006/api2/json/version
    validate_certs: false
    status_code:
      - 200
      - 401
  register: proxmox_health_api

- name: Verify direct Tailscale is running
  ansible.builtin.command:
    argv:
      - /usr/bin/tailscale
      - status
      - --json
  register: proxmox_health_tailscale_status
  changed_when: false
  check_mode: false
  no_log: true

- name: Verify VM startup state when required
  ansible.builtin.command:
    argv:
      - /usr/sbin/qm
      - status
      - "100"
  register: proxmox_health_vm
  changed_when: false
  check_mode: false
  when: proxmox_health_require_vm | bool

- name: Verify storage and NFS startup state
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [/usr/sbin/zpool, list, -H, storage]
    - [/usr/sbin/exportfs, -s]
  register: proxmox_health_storage_commands
  changed_when: false
  check_mode: false

- name: Assert Proxmox health gates
  ansible.builtin.assert:
    that:
      - (proxmox_health_tailscale_status.stdout | from_json).BackendState == 'Running'
      - not (proxmox_health_require_vm | bool) or 'status: running' in proxmox_health_vm.stdout
      - proxmox_health_storage_commands.results | map(attribute='rc') | max == 0
    fail_msg: "Proxmox API, Tailscale, VM startup, ZFS, or NFS health failed."
  no_log: true
