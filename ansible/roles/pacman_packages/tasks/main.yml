---
- name: Require an explicit package list for native pacman convergence
  ansible.builtin.assert:
    that:
      - pacman_packages_requested is sequence
      - pacman_packages_requested is not string
      - pacman_packages_requested | length > 0
    quiet: true

- name: Inspect missing native pacman packages
  ansible.builtin.command:
    argv: "{{ ['/usr/bin/pacman', '--deptest'] + pacman_packages_requested }}"
  register: pacman_packages_missing
  check_mode: false
  changed_when: pacman_packages_missing.stdout_lines | length > 0
  failed_when: pacman_packages_missing.rc not in [0, 127]

- name: Install missing native pacman packages without upgrades
  ansible.builtin.command:
    argv: "{{ ['/usr/bin/pacman', '--sync', '--needed', '--noconfirm'] + pacman_packages_requested }}"
  become: "{{ not ansible_check_mode }}"
  when: pacman_packages_missing.stdout_lines | length > 0
  changed_when: true
