---
- name: Find cloud-image DHCP network definitions
  ansible.builtin.find:
    paths: /etc/systemd/network
    patterns: "*cloud*.network"
    file_type: file
    recurse: false
  register: arch_network_cloud_files

- name: Preview the permanent static Arch network definition
  ansible.builtin.template:
    src: 20-wired.network.j2
    dest: /etc/systemd/network/20-wired.network
    owner: root
    group: root
    mode: "0644"
  check_mode: true
  register: arch_network_preview

- name: Require independent fallback before any persistent network mutation
  ansible.builtin.assert:
    that:
      - >-
        (not arch_network_preview.changed and arch_network_cloud_files.matched == 0) or
        (arch_network_restart_confirmed | default(false) | bool)
      - >-
        not (arch_network_restart_confirmed | default(false) | bool) or
        (recovery_console_confirmed | default(false) | bool)
      - >-
        not (arch_network_restart_confirmed | default(false) | bool) or
        (lan_rollback_confirmed | default(false) | bool)
    fail_msg: "Arch network changes require restart approval plus confirmed console and LAN rollback."

- name: Converge the permanent static Arch network definition
  ansible.builtin.template:
    src: 20-wired.network.j2
    dest: /etc/systemd/network/20-wired.network
    owner: root
    group: root
    mode: "0644"
  register: arch_network_file

- name: Remove superseded cloud-image DHCP definitions
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ arch_network_cloud_files.files }}"
  register: arch_network_cloud_removal
  when: arch_network_restart_confirmed | default(false) | bool

- name: Restart networkd only during an explicitly approved bootstrap
  ansible.builtin.systemd_service:
    name: systemd-networkd.service
    enabled: true
    state: restarted
  when:
    - arch_network_restart_confirmed | default(false) | bool
    - arch_network_file.changed or (arch_network_cloud_removal.changed | default(false))

- name: Verify the expected static address is active
  ansible.builtin.command:
    argv:
      - /usr/bin/ip
      - -4
      - address
      - show
      - dev
      - "{{ arch.network_interface }}"
  register: arch_network_address
  changed_when: false
  check_mode: false

- name: Assert the static address remains present
  ansible.builtin.assert:
    that:
      - network.arch.ipv4.split('/')[0] in arch_network_address.stdout
    fail_msg: "Arch static address is unavailable; stop before storage or Compose writes."
  when:
    - >-
      not ansible_check_mode or
      (not arch_network_preview.changed and arch_network_cloud_files.matched == 0)
