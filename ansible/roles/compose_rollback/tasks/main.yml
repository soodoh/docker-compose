---
- name: Validate the initial Compose rollback contract
  ansible.builtin.assert:
    that:
      - compose_artifact_hash is match('^[0-9a-f]{64}$')
      - ansible_check_mode or (compose_rollback_confirmed | default(false) | ansible.builtin.bool)
    fail_msg: >-
      Initial Compose rollback requires the deployed artifact hash and compose_rollback_confirmed=true
      outside check mode.

- name: Inspect rollback inputs
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    get_mime: false
  become: true
  register: compose_rollback_paths
  loop:
    - "{{ compose_current_dir }}"
    - "{{ compose_runtime_env_path }}"
    - "{{ audit_compose_project_dir }}/docker-compose.yml"
    - "{{ audit_env_path }}"
    - "{{ compose_deployed_hash_path }}"

- name: Require both current and untouched legacy rollback inputs
  ansible.builtin.assert:
    that:
      - compose_rollback_paths.results[0].stat.isdir | default(false)
      - compose_rollback_paths.results[1].stat.isreg | default(false)
      - compose_rollback_paths.results[2].stat.isreg | default(false)
      - compose_rollback_paths.results[3].stat.isreg | default(false)
      - compose_rollback_paths.results[4].stat.isreg | default(false)
    fail_msg: "Current deployment or untouched initial legacy rollback inputs are missing."

- name: Read the deployed artifact identity without displaying it
  ansible.builtin.command:
    argv:
      - /usr/bin/cat
      - "{{ compose_deployed_hash_path }}"
  become: true
  register: compose_rollback_deployed_hash
  changed_when: false
  check_mode: false
  no_log: true

- name: Require the exact deployed artifact selected for rollback
  ansible.builtin.assert:
    that:
      - compose_rollback_deployed_hash.stdout == compose_artifact_hash
    fail_msg: "Deployed artifact identity differs from the separately reviewed rollback hash."
  no_log: true

- name: Remove any stale pre-rollback action plan
  ansible.builtin.file:
    path: /run/docker-compose-rollback-plan.json
    state: absent
  become: true
  changed_when: false
  no_log: true

- name: Produce the root-only pre-rollback action plan
  ansible.builtin.script:
    cmd: >-
      {{ role_path }}/../../../scripts/compose-action-plan.py
      --project-name {{ compose_project_name }}
      --project-directory {{ audit_compose_project_dir }}
      --env-file {{ audit_env_path }}
      --compose-file {{ audit_compose_project_dir }}/docker-compose.yml
      --output /run/docker-compose-rollback-plan.json
    executable: python
  become: true
  environment:
    HOME: "{{ compose_home_dir }}"
  changed_when: false
  check_mode: false
  no_log: true

- name: Read the root-only pre-rollback action plan
  ansible.builtin.slurp:
    src: /run/docker-compose-rollback-plan.json
  become: true
  register: compose_rollback_plan_file
  changed_when: false
  check_mode: false
  no_log: true

- name: Parse the secret-free pre-rollback action plan
  ansible.builtin.set_fact:
    compose_rollback_plan: "{{ compose_rollback_plan_file.content | b64decode | from_json }}"
    compose_rollback_recreate_services: >-
      {{ (compose_rollback_plan_file.content | b64decode | from_json).recreate_services }}
    compose_rollback_forbidden_action_lines: >-
      {{ (compose_rollback_plan_file.content | b64decode | from_json).forbidden_actions }}
  no_log: true

- name: Remove the root-only pre-rollback action plan
  ansible.builtin.file:
    path: /run/docker-compose-rollback-plan.json
    state: absent
  become: true
  changed_when: false
  no_log: true

- name: Report the secret-free proposed rollback recreation set
  ansible.builtin.debug:
    msg:
      recreation_services: "{{ compose_rollback_recreate_services }}"
      forbidden_action_count: "{{ compose_rollback_forbidden_action_lines | length }}"

- name: Require only the reviewed rollback recreation set
  ansible.builtin.assert:
    that:
      - compose_rollback_recreate_services == compose_initial_recreate_services | sort
      - compose_rollback_forbidden_action_lines | length == 0
    fail_msg: "Rollback dry run differs from the reviewed recreation set or proposes create/removal."
  no_log: true

- name: Report the check-mode rollback boundary
  ansible.builtin.debug:
    msg:
      deployed_artifact_hash: "{{ compose_artifact_hash }}"
      recreation_count: "{{ compose_rollback_recreate_services | length }}"
      rollback_project: "{{ audit_compose_project_dir }}"
  changed_when: true
  when: ansible_check_mode

- name: Re-converge the untouched legacy project
  when: not ansible_check_mode
  block:
    - name: Converge the legacy project without pulls, builds, removals, or orphan removal
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - compose
          - --project-name
          - "{{ compose_project_name }}"
          - --project-directory
          - "{{ audit_compose_project_dir }}"
          - --env-file
          - "{{ audit_env_path }}"
          - --file
          - "{{ audit_compose_project_dir }}/docker-compose.yml"
          - up
          - --detach
          - --no-build
          - --pull
          - never
      become: true
      environment:
        HOME: "{{ compose_home_dir }}"
      no_log: true

    - name: Produce the root-only post-rollback action plan
      ansible.builtin.script:
        cmd: >-
          {{ role_path }}/../../../scripts/compose-action-plan.py
          --project-name {{ compose_project_name }}
          --project-directory {{ audit_compose_project_dir }}
          --env-file {{ audit_env_path }}
          --compose-file {{ audit_compose_project_dir }}/docker-compose.yml
          --output /run/docker-compose-rollback-post-plan.json
        executable: python
      become: true
      environment:
        HOME: "{{ compose_home_dir }}"
      changed_when: false
      no_log: true

    - name: Read the root-only post-rollback action plan
      ansible.builtin.slurp:
        src: /run/docker-compose-rollback-post-plan.json
      become: true
      register: compose_rollback_post_plan_file
      changed_when: false
      no_log: true

    - name: Parse the secret-free post-rollback action plan
      ansible.builtin.set_fact:
        compose_rollback_post_plan: >-
          {{ compose_rollback_post_plan_file.content | b64decode | from_json }}
      no_log: true

    - name: Remove the root-only post-rollback action plan
      ansible.builtin.file:
        path: /run/docker-compose-rollback-post-plan.json
        state: absent
      become: true
      changed_when: false
      no_log: true

    - name: Require an idempotent post-rollback dry run
      ansible.builtin.assert:
        that:
          - compose_rollback_post_plan.recreate_services | length == 0
          - compose_rollback_post_plan.forbidden_actions | length == 0
        fail_msg: "Post-rollback dry run still proposes container convergence."
      no_log: true

    - name: Remove the active stable-deployment identity after rollback
      ansible.builtin.file:
        path: "{{ compose_deployed_hash_path }}"
        state: absent
      become: true
