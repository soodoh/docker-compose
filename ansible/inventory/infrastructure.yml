---
all:
  children:
    proxmox_hosts:
      hosts:
        proxmox:
          ansible_host: proxmox
          ansible_user: tofu-apply
          ansible_python_interpreter: /usr/bin/python3
          ansible_become: true
          ansible_ssh_common_args: >-
            -o ConnectTimeout=10
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
    docker_host:
      hosts:
        docker-host-production:
          ansible_host: docker-host
          ansible_user: ansible-deploy
          ansible_python_interpreter: /usr/bin/python
          ansible_become: true
          ansible_become_method: sudo
          ansible_ssh_common_args: >-
            -o ConnectTimeout=10
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
