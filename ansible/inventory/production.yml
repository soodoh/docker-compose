---
# Direct Tailscale endpoint for remote controllers with an approved tailnet identity.
# The first controller is an ephemeral GitHub-hosted node tagged tag:ci.
all:
  children:
    docker_host:
      hosts:
        docker-host-production:
          ansible_host: docker-host
          ansible_user: ansible-deploy
          ansible_python_interpreter: /usr/bin/python
          # The workflow learns the SSH host key only after joining the authenticated
          # tailnet path and keeps normal Ansible host-key verification enabled.
          ansible_ssh_common_args: >-
            -o ConnectTimeout=10
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
          # The deployment user is outside the docker group. Remote audits use its
          # separately validated passwordless sudo policy.
          ansible_become: true
          ansible_become_method: sudo
