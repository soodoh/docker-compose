---
# Deferred until the separately approved Tailscale and deploy-user bootstrap.
# Replace the .invalid address only after recovery paths and tailnet SSH work.
all:
  children:
    docker_host:
      hosts:
        docker-host-production:
          ansible_host: docker-host.replace-me.invalid
          ansible_user: ansible-deploy
          ansible_python_interpreter: /usr/bin/python
          # The deployment user is never added to the docker group. Remote
          # audits and convergence use its separately managed sudo policy.
          ansible_become: true
          ansible_become_method: sudo
