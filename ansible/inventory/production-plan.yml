---
# Automatic check-mode controllers use a separate host identity with no general sudo.
all:
  children:
    docker_host:
      hosts:
        docker-host-production:
          ansible_host: 100.111.210.72
          ansible_user: ansible-plan
          ansible_python_interpreter: /usr/bin/python
          ansible_ssh_common_args: >-
            -o ConnectTimeout=10
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
          ansible_become: false
          iac_readonly_controller: true
